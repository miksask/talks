  <title
     id="title">Checkpoint is not the effect ledger</title>
  <desc
     id="desc">The external effect commits and returns a receipt, but the workflow runtime crashes before the graph checkpoint records success. A resumed run retries with the same operation ID, and the effect service and ledger return the existing receipt or reconcile uncertain state.</desc>
