  <title
     id="title">LangGraph interrupt and resume sequence</title>
  <desc
     id="desc">The approval node stores pending state and interrupts. A decision resumes the same checkpointed thread. LangGraph re-enters the interrupted node from its beginning, so pre-interrupt code must be free of side effects; the effect node runs only after validation.</desc>
