  <title
     id="title">A stale approval cannot authorize a changed rule</title>
  <desc
     id="desc">An approval is bound to a specific rule version. If the live rule changes from version 7 to version 8 while approval is pending, runtime revalidation rejects the stale approval and requires a fresh review.</desc>
