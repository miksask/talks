<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" width="1160" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Alert fatigue</title>
  <desc id="desc">Schematic timeline showing recurring alerts at the described 5 to 10 minute interval and repeated on-call triage. No incident counts or measured performance values are shown.</desc>
  <defs>
    <marker id="arrow-dark-teal" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#126275"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#E27070"/></marker>
  </defs>
  <g id="timeline">
    <text x="32" y="34" fill="#4A6870" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" dominant-baseline="central">REPEATED ALERT CYCLE · SCHEMATIC</text>
    <line x1="132" y1="160" x2="1028" y2="160" stroke="#126275" stroke-width="2" stroke-linecap="round"/>
    <rect x="40" y="128" width="184" height="64" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="132.0" y="160.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Latency alert</text>
    <rect x="272" y="128" width="184" height="64" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="364.0" y="160.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Latency alert</text>
    <rect x="504" y="128" width="184" height="64" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="596.0" y="160.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Latency alert</text>
    <rect x="736" y="128" width="184" height="64" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="828.0" y="160.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Latency alert</text>
    <rect x="968" y="128" width="184" height="64" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="1060.0" y="160.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Latency alert</text>
    <text x="580" y="80" fill="#4A6870" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" >Recurring every 5–10 minutes</text>
    <line x1="580" y1="192" x2="580" y2="260" stroke="#126275" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-dark-teal)"/>
    <rect x="392" y="272" width="376" height="64" rx="8" fill="#192833" stroke="#192833" stroke-width="2" /><text x="580.0" y="304.0" fill="#FFFFFF" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >On-call repeats triage</text>
  </g>
</svg>