<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Limits end in a defined outcome</title>
  <desc id="desc">No progress, exhausted budget, deadline, or approval timeout ends agent execution and transfers ownership to a person. Missing a reply never approves the action.</desc>
  <defs>
    <marker id="arrow-dark-teal" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#126275"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#E27070"/></marker>
  </defs>
  <g id="state-transition">
    <rect x="48" y="72" width="208" height="48" rx="24" fill="#FFB566" stroke="#FFB566" stroke-width="1" /><text x="152.0" y="96.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" >No progress</text><rect x="288" y="72" width="208" height="48" rx="24" fill="#FFB566" stroke="#FFB566" stroke-width="1" /><text x="392.0" y="96.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" >Budget exhausted</text><rect x="528" y="72" width="208" height="48" rx="24" fill="#FFB566" stroke="#FFB566" stroke-width="1" /><text x="632.0" y="96.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" >Deadline reached</text><rect x="768" y="72" width="264" height="48" rx="24" fill="#FFB566" stroke="#FFB566" stroke-width="1" /><text x="900.0" y="96.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" >No reply → timeout</text>
    <rect x="48" y="240" width="304" height="80" rx="8" fill="#F2F9F9" stroke="#126275" stroke-width="2" /><text x="200.0" y="268.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Agent-owned</text><text x="200.0" y="292.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" >incident</text><rect x="808" y="240" width="304" height="80" rx="8" fill="#192833" stroke="#192833" stroke-width="2" /><text x="960.0" y="268.0" fill="#FFFFFF" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >Human-owned</text><text x="960.0" y="292.0" fill="#FFFFFF" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" >incident</text><line x1="352" y1="280" x2="808" y2="280" stroke="#126275" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-dark-teal)"/>
    <text x="580" y="224" fill="#4A6870" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" >deterministic escalation</text>
    <text x="580" y="168" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="central" >Triggers end the run; none counts as approval.</text>
    <rect x="400" y="336" width="360" height="48" rx="24" fill="#4BCFA0" stroke="#4BCFA0" stroke-width="1" /><text x="580.0" y="360.0" fill="#192833" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" >Stop agent · transfer ownership</text>
  </g>
</svg>